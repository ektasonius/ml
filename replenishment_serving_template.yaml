apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: mdq-replenishment-extratrees
  namespace: default
  labels:
    app.kubernetes.io/name: mdq-replenishment
    scenarios.ai.sap.com/id: mdq-replenishment-classification
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    artifacts: []
    parameters: []
  template:
    apiVersion: serving.kserve.io/v1beta1
    metadata:
      annotations:
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "1"
    spec:
      predictor:
        imagePullSecrets:
          - name: docker-secret
        containers:
          - name: kserve-container
            image: ektasoni/mdq-replenishment:latest
            ports:
              - containerPort: 8080
                protocol: TCP
            env:
              - name: PORT
                value: "8080"
            resources:
              requests:
                cpu: "0.5"
                memory: "512Mi"
              limits:
                cpu: "1"
                memory: "1Gi"
